server {
  listen 80;
  server_name _;

  # Allow large uploads (e.g. videos)
  client_max_body_size 300m;

  root /usr/share/nginx/html;
  index index.html;

  # Docker 的内嵌 DNS。只在容器里有效（本文件就是打进前端镜像的）。
  #
  # 它必须存在，否则下面 proxy_pass 里用变量的写法会在运行时报
  # "no resolver defined to resolve backend"。valid=10s 表示解析结果最多缓存
  # 10 秒，也就是后端换 IP 后最多 10 秒自愈。
  resolver 127.0.0.11 valid=10s ipv6=off;

  # SPA routing (Vue Router history mode)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy to backend (strip /api prefix)
  #
  # 为什么是「变量 + resolver」而不是直接写 proxy_pass http://backend:8080/：
  #
  #   后者里的主机名只在 **nginx 启动时**解析一次，之后永远用那个 IP。
  #   而容器是会被重建的（docker compose up -d --build backend、restart 等），
  #   重建后后端可能拿到新 IP，**旧 IP 还会被别的容器复用**。此时 nginx 会一直
  #   往那个旧 IP 发请求 —— 对外表现是**所有 /api 请求 502**，而它自己 healthy、
  #   后端也 healthy，两边日志都正常，极难排查。
  #
  #   本仓库实际踩过一次：后端重建后 IP 从 172.22.0.4 变成 172.22.0.7，
  #   而 .4 被 worker 接手，nginx 一直连 worker 的 8080 端口（connection refused）。
  #   前端页面每个接口都是「请求失败 (502)」，后端侧却看不出任何异常。
  #
  # 写成变量后，nginx 会在每次请求时按 resolver 重新解析，最多滞后 valid 的时长。
  #
  # 注意：proxy_pass 用变量时，nginx 不再做「用 proxy_pass 里的 URI 替换掉
  # location 前缀」这件事，所以要自己去掉 /api 前缀（下面的 rewrite ... break）。
  location /api/ {
    set $backend_host http://backend:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_host;
    proxy_http_version 1.1;
    # Keep original Host (incl. port) so backend can generate correct absolute URLs
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve uploaded files via backend static route
  #
  # 路径不需要改写（/static/... 原样转发），所以这里只换成变量形式，
  # 同样是为了让后端换 IP 后能自动跟上。
  location /static/ {
    set $backend_host http://backend:8080;
    proxy_pass $backend_host;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
}
