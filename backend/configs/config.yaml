observability:
  pprof:
    enabled: true
    api_addr: localhost:6060
    worker_addr: localhost:6061

# ---- AI 能力（全部可选；删掉整个 ai: 段服务照常启动）----
#
# 默认全关：enabled=false 时不产生任何模型调用、embedding 调用、向量读写，
# 系统行为与引入 AI 之前完全一致。开启前请先确保 sidecar 已起来。
#
# 注意：本段任何字段缺失都不会导致进程启动失败（刻意不加入必填校验）。
ai:
  enabled: false
  gateway_addr: localhost:50051   # sidecar 的 gRPC 地址；留空 = 视为未配置，等同关闭
  timeout: 2s                   # 单次调用超时；必须写成 "2s" 这种时长字符串
  model: gpt-4o-mini
  max_tokens: 512
  daily_budget: 0               # 占位：仅记录计量，不做硬拦截
  # P1：采纳 AI 标签的置信度下限（0~1，可选）。低于它的标签不入库；
  # 0 或越界时退回代码默认值 0.6。调高 = 少而准，调低 = 多而杂。
  tag_min_confidence: 0.6
  # P2：embedding 通道（全部可选，缺省 = 向量功能关闭）。
  #
  # 这三项必须与 sidecar 的 AI_EMBEDDING_* 一致：Go 侧用 dim 做本地校验，
  # 不一致时会立刻失败，而不是让两种维度的向量混进同一张表。
  embedding_model: text-embedding-3-small
  embedding_dim: 1536
  embedding_timeout: 3s         # 比 chat 的 2s 宽：embedding 是批量的，且只在旁路使用
  # 显式写出"要归一化"。它的默认值就是 true，写 false 会让更长的文本
  # 在余弦检索里系统性占优，而现象看起来像"模型偏好长内容"。
  embedding_normalize: true
  # P2：语义召回与精排（全部可选，缺省 = 功能关闭）。
  #
  # recall_quota 是语义召回在最终列表里的目标占比；**显式写 0 就等于关掉
  # 语义路，结果与引入 P2 之前逐字节一致**（P2 的降级等价性验收项）。
  # 缺省（整段不写）也是 0，所以这里的 0.3 是"设计取值"而不是"默认值"。
  recall_quota: 0.3
  # 新内容探索配额：每 10 条留 1 条给"最近发布且互动很少"的视频。
  # 没有它，新视频因为既没向量也没交互，会永远进不了召回池。
  explore_quota: 0.1
  # LLM 精排默认关闭：真实模型的 P50/P99 必须先实测再决定开不开
  # （步骤见 AI-P2-设计决定.md）。开启前也要同步调大 rerank_timeout，
  # 否则等于"开了但永远走降级"。
  rerank_enabled: false
  rerank_timeout: 120ms
  rerank_candidates: 20
